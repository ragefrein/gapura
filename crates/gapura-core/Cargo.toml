[package]
name = "gapura-core"
description = "Core library for Gapura: domain model, encrypted vault, settings. Deliberately free of UI framework dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true

aes-gcm = "0.11"
argon2 = "0.6"
base64 = "0.22"
bytes = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "net", "time", "io-util"] }
dirs = "6"
keyring = "4"
zeroize = "1"

# Pinned to the exact version russh 0.65 uses so PublicKey types unify.
ssh-key = { version = "=0.7.0-rc.11", features = ["ed25519", "rand_core", "getrandom", "encryption"] }
rand_core = "0.10"
getrandom = "0.4"
russh = "0.65"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
