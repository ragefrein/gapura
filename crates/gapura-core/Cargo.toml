[package]
name = "gapura-core"
description = "Core library for Gapura: domain model, encrypted vault, settings. Deliberately free of UI framework dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true

aes-gcm = "0.11"
argon2 = "0.6"
base64 = "0.22"
dirs = "6"
keyring = "4"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"

ssh-key = { version = "0.6", features = ["ed25519", "rand_core", "getrandom", "encryption"] }

[dev-dependencies]
tempfile = "3"
