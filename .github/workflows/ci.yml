name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all-targets

  sshd-integration:
    name: Core against real sshd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start local sshd with pubkey auth
        run: |
          sudo systemctl start ssh || sudo systemctl start sshd
          ssh-keygen -t ed25519 -N '' -f "$HOME/.ssh/id_ed25519"
          cat "$HOME/.ssh/id_ed25519.pub" >> "$HOME/.ssh/authorized_keys"
          chmod 700 "$HOME/.ssh" && chmod 600 "$HOME/.ssh/authorized_keys"
          echo "GAPURA_TEST_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "GAPURA_TEST_PORT=22" >> "$GITHUB_ENV"
          echo "GAPURA_TEST_USER=$USER" >> "$GITHUB_ENV"
          echo "GAPURA_TEST_KEY=$HOME/.ssh/id_ed25519" >> "$GITHUB_ENV"
      - name: Integration tests
        run: cargo test -p gapura-core --test ssh_integration

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
