# cargo-deny configuration: advisories, licenses, and crate sources.
# CI runs `cargo deny check` (see .github/workflows/ci.yml).

[advisories]
version = 2
yanked = "deny"
ignore = [
    # russh 0.65 pins `rsa 0.10.0-rc.18`, a prerelease of 0.10.0. The advisory
    # (Marvin Attack) is patched in `>=0.10.0`; the prerelease already carries
    # the crypto-bigint migration, but semver puts it below the fixed version.
    # Revisit when russh ships the final 0.10.0.
    "RUSTSEC-2023-0071",
    # All of the following have no safe upgrade path because they sit inside
    # crates pinned by our dependencies; none is a vulnerability itself:
    # - proc-macro-error: unmaintained, pulled in by gtk-rs 0.18 via tauri 2.
    # - glib VariantStrIter unsoundness: fixed in gtk-rs 0.20, tauri 2 pins 0.18.
    # - zbus_names / zvariant / zvariant_derive: merged into zbus 6, pulled in
    #   by keyring 4 (Secret Service) and tauri-plugin-opener.
    "RUSTSEC-2024-0370",
    "RUSTSEC-2024-0429",
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
]

[licenses]
version = 2
# Everything in the tree should be permissive.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.93

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
